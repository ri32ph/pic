<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#167d83">
    <title>ピクロス｜難易度を選んで遊ぼう</title>
    <style>
    :root {
        font-family: system-ui, -apple-system, 'Noto Sans JP', sans-serif;
        color: #263b42;
        background:#f3f8f8
    }

    * {
        box-sizing:border-box
    }

    body {
        margin:0
    }

    main {
        max-width: 660px;
        margin: auto;
        padding:22px 16px 60px
    }

    h1 {
        font-size: clamp(25px, 5vw, 34px);
        margin:0 0 6px
    }

    p {
        line-height:1.7
    }

    .muted {
        color:#536d73
    }

    .panel {
        background: white;
        border: 1px solid #dce9e9;
        border-radius: 18px;
        padding: 20px;
        margin-top: 16px;
        box-shadow:0 5px 20px #12494c0b
    }

    .top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        flex-wrap:wrap
    }

    .tag {
        background: #e5f4f2;
        color: #176e72;
        padding: 6px 12px;
        border-radius: 999px;
        font-weight: 700;
        font-size:13px
    }

    button, select {
        font:inherit
    }

    button {
        cursor: pointer;
        border: 1px solid #bad5d5;
        background: #fff;
        border-radius: 11px;
        padding: 10px 14px;
        color: #24535a;
        font-weight:700
    }

    button:focus-visible, select:focus-visible {
        outline: 3px solid #f3aa42;
        outline-offset:2px
    }

    button.primary, .selected {
        background: #167d83 !important;
        color: #fff !important;
        border-color:#167d83 !important
    }

    button:disabled {
        opacity: .55;
        cursor:default
    }

    select {
        width: 100%;
        padding: 12px;
        border: 1px solid #b6d3d4;
        border-radius: 10px;
        background: white;
        color:#263b42
    }

    .tools {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin:14px 0
    }

    .tools button {
        flex: 1;
        min-width:80px
    }

    .board-wrap {
        overflow-x: auto;
        padding:8px 0 12px
    }

    .board {
        --cell: clamp(21px, 7vw, 56px);
        --n: 5;
        --hint: 80px;
        display: grid;
        grid-template-columns: var(--hint) repeat(var(--n), var(--cell));
        grid-template-rows: var(--hint) repeat(var(--n), var(--cell));
        width: max-content;
        margin:auto
    }

    .corner {
        background: #f1f7f7;
        border-radius:10px 0 0 0
    }

    .hint {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        color: #37525b;
        font-weight: 800;
        font-size: clamp(10px, 2.5vw, 15px);
        background:#f1f7f7
    }

    .hint.col {
        flex-direction: column;
        justify-content: flex-end;
        padding-bottom:4px
    }

    .hint.row {
        justify-content: flex-end;
        padding-right:5px
    }

    .hint.done {
        color:#829da1
    }

    .cell {
        width: var(--cell);
        height: var(--cell);
        padding: 0;
        border-radius: 0;
        border: 1px solid #a9c6c8;
        margin: -.5px;
        display: grid;
        place-items: center;
        background: white;
        color: #a54747;
        font-size: 26px;
        touch-action:manipulation
    }

    .cell.filled {
        background: #167d83;
        border-color:#12656a
    }

    .cell.crossed {
        background:#f6f8f8
    }

    .cell:focus-visible {
        z-index:1
    }

    .status {
        padding: 12px;
        border-radius: 12px;
        background: #edf5f5;
        min-height: 52px;
        line-height:1.6
    }

    .status.win {
        background: #e1f5e8;
        color: #175c39;
        font-weight:800
    }

    .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top:14px
    }

    .actions button {
        flex:1
    }

    .small {
        font-size:14px
    }

    footer {
        margin-top: 25px;
        color: #61787d;
        font-size:13px
    }

    #reveal {
        margin-top:10px
    }

    @media (max-width: 400px) {
        .panel {
            padding:12px
        }

        .hint {
            font-size:11px
        }

        .hint.row {
            padding-right: 3px
        }
    }
    </style>
</head>
<body>
    <main>
        <div class="top">
            <div>
                <h1>🧩 ピクロス</h1>
                <p class="muted" style="margin:0">数字を手がかりに、隠れた絵を完成させよう。</p>
            </div>
            <span class="tag">難易度を選択</span>
        </div>
        <section class="panel">
            <label for="difficulty">
                <strong>難易度を選ぶ</strong>
            </label>
            <select id="difficulty">
                <option value="5">かんたん｜5×5</option>
                <option value="10">ふつう｜10×10</option>
                <option value="15">むずかしい｜15×15</option>
            </select>
            <label for="puzzle" style="display:block;margin-top:14px">
                <strong>問題を選ぶ</strong>
            </label>
            <select id="puzzle"></select>
            <p id="description" class="muted small"></p>
            <div class="top">
                <strong id="progress">塗ったマス：0</strong>
                <span id="number" class="tag"></span>
            </div>
            <div class="tools" role="group" aria-label="マスの操作">
                <button id="fill" class="selected" aria-pressed="true">■ 塗る</button>
                <button id="cross" aria-pressed="false">× 印</button>
                <button id="erase" aria-pressed="false">消す</button>
            </div>
            <div class="board-wrap">
                <div id="board" class="board" role="group" aria-label="ピクロス盤面"></div>
            </div>
            <div id="status" class="status" role="status" aria-live="polite">縦と横の数字を見て、マスを塗ろう。</div>
            <div class="actions">
                <button id="reset">最初から</button>
                <button id="check">答えを確認</button>
                <button id="next" class="primary">次の問題 →</button>
            </div>
            <button id="reveal">正解を表示</button>
        </section>
        <section class="panel">
            <h2 style="margin-top:0;font-size:20px">遊び方</h2>
            <p>数字は、連続して塗るマスの数を表す。たとえば「2 1」は、2マス続けて塗り、少なくとも1マス空けて、さらに1マス塗るという意味だ。</p>
            <p>「■ 塗る」「× 印」「消す」を選び、盤面をタップする。すべての塗るマスが正しくなったら自動で完成判定する。×印は空白のメモなので、付けなくてもクリアできる。</p>
            <p class="small muted">絵のテーマは固定していない。何の絵かは完成後に表示する。数字ヒントは正解から自動計算している。</p>
        </section>
        <footer>ブラウザで遊べるピクロス。</footer>
    </main>
    <script>
    'use strict';
    const basePuzzles = [
    {
        name: 'ハート',
        rows: ['01010', '11111', '11111', '01110', '00100']
    },
    {
        name: '星',
        rows: ['00100', '10101', '01110', '11111', '01010']
    },
    {
        name: '家',
        rows: ['00100', '01110', '11111', '10101', '11111']
    },
    {
        name: '木',
        rows: ['00100', '01110', '11111', '00100', '01110']
    },
    {
        name: '矢印',
        rows: ['00100', '01100', '11111', '01100', '00100']
    },
    {
        name: 'カップ',
        rows: ['00000', '11110', '10111', '11110', '01100']
    }
    ];
    // Larger puzzles are hand-authored pixel-art silhouettes, not stretched 5x5 grids.
    const patterns10 = [
    {
        name: '魚',
        rows: ['0000110000', '0001111000', '1011111100', '1111111110', '1111111111', '1111111110', '1011111100', '0001111000', '0000110000', '0000000000']
    },
    {
        name: '傘',
        rows: ['0000110000', '0001111000', '0011111100', '0111111110', '1111111111', '0000110000', '0000110000', '0000110000', '0000110100', '0000011000']
    },
    {
        name: '山',
        rows: ['0000110000', '0001111000', '0011111100', '0111111110', '1111111111', '1111111111', '1111111111', '1111111111', '1111111111', '1111111111']
    },
    {
        name: '船',
        rows: ['0000010000', '0000011000', '0000011100', '0000011110', '0000010000', '1111111111', '0111111110', '0011111100', '0001111000', '0000000000']
    }
    ];
    const patterns15 = [
    {
        name: '蝶',
        rows: ['110000000000011', '111000000000111', '111100010001111', '111110111011111', '011111111111110', '001111111111100', '000111111111000', '000011111110000', '000111111111000', '001111111111100', '011110111011110', '111100010001111', '111000010000111', '110000010000011', '000000010000000']
    },
    {
        name: '灯台',
        rows: ['000000010000000', '000000111000000', '000001111100000', '000001111100000', '000000111000000', '000001111100000', '000001101100000', '000001101100000', '000001101100000', '000001101100000', '000001101100000', '000011111110000', '000011111110000', '000111111111000', '001111111111100']
    },
    {
        name: 'ロケット',
        rows: ['000000010000000', '000000111000000', '000001111100000', '000001111100000', '000001101100000', '000001101100000', '000001111100000', '000001111100000', '000001111100000', '000011111110000', '000111111111000', '000110111011000', '000100010001000', '000000111000000', '000000010000000']
    }
    ];
    const bank = {
        5: basePuzzles,
        10: patterns10,
        15: patterns15
    };
    let size = 5,
        puzzles = bank[size];
    for (const [n, arr] of Object.entries(bank))
        for (const p of arr) {
            if (p.rows.length !== Number(n) || p.rows.some(r => r.length !== Number(n) || /[^01]/.test(r)))
                throw Error('Invalid puzzle ' + p.name)
        }
    const $ = id => document.getElementById(id);
    let idx = 0,
        mode = 'fill',
        state = [],
        solved = false,
        revealed = false;
    const clues = line => {
        let out = [],
            n = 0;
        for (const v of [...line, '0']) {
            if (v === '1')
                n++;
            else if (n) {
                out.push(n);
                n = 0
            }
        }
        return out.length ? out : [0]
    };
    function setMode(m) {
        mode = m;
        for (const v of ['fill', 'cross', 'erase']) {
            $(v).classList.toggle('selected', v === m);
            $(v).setAttribute('aria-pressed', String(v === m))
        }
    }
    function win() {
        return state.every((v, i) => (v === 1) === (puzzles[idx].rows[Math.floor(i / size)][i % size] === '1'))
    }
    function update() {
        const target = puzzles[idx].rows.join('');
        const count = state.filter(x => x === 1).length;
        $('progress').textContent = `塗ったマス：${count} / ${[...target].filter(x => x === '1').length}`;
        const success = win();
        if (success && !revealed) {
            solved = true;
            $('description').textContent = `答え：${puzzles[idx].name} — ${puzzles[idx].desc}`;
            $('status').textContent = `🎉 完成！「${puzzles[idx].name}」の正解だ！`;
            $('status').classList.add('win')
        } else if (!revealed) {
            solved = false;
            $('status').classList.remove('win');
            $('status').textContent = '縦と横の数字を見て、マスを塗ろう。'
        }
        renderHints()
    }
    function renderHints() {
        document.querySelectorAll('.hint[data-line]').forEach(el => {
            const kind = el.dataset.kind,
                n = Number(el.dataset.line);
            const vals = kind === 'row' ? state.slice(n * size, n * size + size) : Array.from({
                length: size
            }, (_, r) => state[r * size + n]);
            const original = kind === 'row' ? puzzles[idx].rows[n] : puzzles[idx].rows.map(r => r[n]).join('');
            el.classList.toggle('done', clues(vals.map(v => v === 1 ? '1' : '0').join('')).join(',') === clues(original).join(',') && vals.every((v, i) => (v === 1) === (original[i] === '1')))
        })
    }
    function draw() {
        const board = $('board');
        board.replaceChildren();
        board.style.setProperty("--n", size);
        board.style.setProperty("--cell", size === 5 ? "clamp(43px,10vw,64px)" : size === 10 ? "clamp(27px,6.3vw,44px)" : "clamp(21px,4.4vw,32px)");
        board.style.setProperty("--hint", size === 15 ? "90px" : "80px");
        const corner = document.createElement('div');
        corner.className = 'corner';
        board.append(corner);
        for (let c = 0; c < size; c++) {
            const el = document.createElement('div');
            el.className = 'hint col';
            el.dataset.kind = 'col';
            el.dataset.line = c;
            el.setAttribute('aria-label', `列${c + 1}のヒント`);
            clues(puzzles[idx].rows.map(r => r[c]).join('')).forEach(n => {
                const s = document.createElement('span');
                s.textContent = n;
                el.append(s)
            });
            board.append(el)
        }
        for (let r = 0; r < size; r++) {
            const h = document.createElement('div');
            h.className = 'hint row';
            h.dataset.kind = 'row';
            h.dataset.line = r;
            h.setAttribute('aria-label', `行${r + 1}のヒント`);
            clues(puzzles[idx].rows[r]).forEach(n => {
                const s = document.createElement('span');
                s.textContent = n;
                h.append(s)
            });
            board.append(h);
            for (let c = 0; c < size; c++) {
                const pos = r * size + c;
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'cell' + (state[pos] === 1 ? ' filled' : state[pos] === -1 ? ' crossed' : '');
                b.textContent = state[pos] === -1 ? '×' : '';
                b.setAttribute('aria-label', `${r + 1}行${c + 1}列：${state[pos] === 1 ? '塗り' : state[pos] === -1 ? '×印' : '空白'}`);
                b.disabled = revealed;
                b.addEventListener('click', () => {
                    if (revealed)
                        return;
                    const desired = mode === 'fill' ? 1 : mode === 'cross' ? -1 : 0;
                    state[pos] = state[pos] === desired ? 0 : desired;
                    draw();
                    update()
                });
                board.append(b)
            }
        }
        renderHints()
    }
    function load(i) {
        idx = (i + puzzles.length) % puzzles.length;
        state = Array(size * size).fill(0);
        solved = false;
        revealed = false;
        $('puzzle').value = String(idx);
        $('description').textContent = '数字を手がかりに、隠れた絵を完成させよう。';
        $('number').textContent = `第${idx + 1}問 / ${puzzles.length}問`;
        $('reveal').disabled = false;
        draw();
        update()
    }
    function populate() {
        $('puzzle').replaceChildren();
        puzzles.forEach((p, i) => {
            const o = document.createElement('option');
            o.value = i;
            o.textContent = `第${i + 1}問`;
            $('puzzle').append(o)
        })
    }
    populate();
    $('difficulty').addEventListener('change', e => {
        size = Number(e.target.value);
        puzzles = bank[size];
        populate();
        load(0)
    });
    $('puzzle').addEventListener('change', e => load(Number(e.target.value)));
    for (const m of ['fill', 'cross', 'erase'])
        $(m).addEventListener('click', () => setMode(m));
    $('reset').addEventListener('click', () => load(idx));
    $('next').addEventListener('click', () => load(idx + 1));
    $('check').addEventListener('click', () => {
        if (win() && !revealed) {
            update()
        } else if (revealed) {
            $('status').textContent = '正解を表示中。次の問題に進もう。'
        } else {
            $('status').classList.remove('win');
            $('status').textContent = 'まだ完成していない。数字ヒントと塗ったマスを見直そう。'
        }
    });
    $('reveal').addEventListener('click', () => {
        if (!confirm('正解を表示する？ この問題の途中経過は上書きされる。'))
            return;
        state = [...puzzles[idx].rows.join('')].map(x => x === '1' ? 1 : 0);
        revealed = true;
        solved = false;
        $('description').textContent = `答え：${puzzles[idx].name} — ${puzzles[idx].desc}`;
        draw();
        $('reveal').disabled = true;
        $('status').classList.remove('win');
        $('status').textContent = `「${puzzles[idx].name}」の正解を表示中。`;
        const target = puzzles[idx].rows.join('');
        $('progress').textContent = `正解のマス：${[...target].filter(x => x === '1').length}`
    });
    load(0);
    </script>
</body>
</html>
